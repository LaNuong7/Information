<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tiếng Việt Brochure</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin:0;
        font-family: Arial, sans-serif;
        background:#f5f7fa;
        text-align:center;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        padding:20px;
    }
    img {
        width:100%;
        max-width:1000px;
        height:auto;
        box-shadow:0 4px 10px rgba(0,0,0,0.15);
        margin-bottom:20px;
    }
    .switch {
        background:#044B38;
        color:white;
        padding:12px 24px;
        border:none;
        border-radius:6px;
        cursor:pointer;

        width:220px;
        max-width:80%;
    }
    .switch:hover {
        opacity:0.85;
    }

</head>

<img src="brochure-vi.jpg" alt="Vietnamese Brochure">
<button class="switch" onclick="location.href='index.html'">Change Language</button>
