<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Language</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin:0;
        font-family: Arial, sans-serif;
        background:#f5f7fa;
        text-align:center;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        flex-direction:column;
        padding:20px;
    }
    h1 {
        margin-bottom:20px;
        font-size:2rem;
    }
    .lang-btn {
        background:#044B38;
        color:white;
        width:220px;
        max-width:80%;
        padding:12px 24px;
        margin:10px 0;
        border:none;
        border-radius:6px;
        cursor:pointer;
        font-size:16px;
    }
    .lang-btn:hover {
        opacity:0.85;
    }
</style>
</head>
<body>
<h1>Select Your Language</h1>
<button class="lang-btn" onclick="location.href='en.html'">English</button>
<button class="lang-btn" onclick="location.href='vi.html'">Tiếng Việt</button>
</body>
</html>
